<text x="710.0" y="342.0" font-size="12" fill="#5c6762" text-anchor="middle" font-weight="400">10</text>
<text x="410.0" y="362.0" font-size="13" fill="#5c6762" text-anchor="middle" font-weight="400">追蹤時間（年）</text>
<circle cx="40" cy="374" r="5.5" fill="#b84232"/><text x="52.0" y="378.0" font-size="12" fill="#5c6762" text-anchor="start" font-weight="400">在 [t, t+Δt) 內發生事件</text>
<circle cx="220" cy="374" r="5.5" fill="#0b6f69"/><text x="232.0" y="378.0" font-size="12" fill="#5c6762" text-anchor="start" font-weight="400">其他時間的事件</text>
<circle cx="352" cy="374" r="5" fill="#fbfcf8" stroke="#0b6f69" stroke-width="2.5"/><text x="364.0" y="378.0" font-size="12" fill="#5c6762" text-anchor="start" font-weight="400">censored</text>
<line x1="452" x2="472" y1="374" y2="374" stroke="#a9b3ae" stroke-width="3"/><text x="478.0" y="378.0" font-size="12" fill="#5c6762" text-anchor="start" font-weight="400">t 之前已離開 risk set</text>
<text x="736.0" y="34.0" font-size="13" fill="#17201f" text-anchor="end" font-weight="400">t 時 risk set：6 人　區間內事件：1 人　ĥ(t) ≈ 1 ÷ (6 × Δt)</text>
</svg>
