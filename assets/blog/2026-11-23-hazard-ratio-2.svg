<title id="t">Hazard、累積 hazard 與存活函數的關係</title><desc id="d">三個小圖：第一張是隨時間上升的 hazard 函數 h(t)，曲線下 0 到 6 年的面積就是累積 hazard H(6)=0.60；第二張是 H(t)；第三張是存活函數 S(t)=e 的負 H(t) 次方，S(6) 約為 55%，對應累積風險約 45%。</desc>
