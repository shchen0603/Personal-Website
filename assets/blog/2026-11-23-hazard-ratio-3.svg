<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Inter',sans-serif">
<title id="t">Hazard Ratio 與 Risk Ratio 的差距</title><desc id="d">橫軸是對照組累積風險，縱軸是 Risk Ratio。HR 固定為 0.5 時，RR 從風險 2% 時的 0.50 上升到 30% 時的 0.54、80% 時的 0.69；HR 固定為 2.0 時，RR 從 1.98 降到 1.70、1.20。事件越常見，RR 與 HR 差得越多。</desc>
<rect width="760" height="420" rx="12" fill="#fbfcf8"/>
<text x="24.0" y="34.0" font-size="17" fill="#17201f" text-anchor="start" font-weight="700">HR 固定時，RR 會隨對照組累積風險而改變</text>
