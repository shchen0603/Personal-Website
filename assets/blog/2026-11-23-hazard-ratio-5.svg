<line x1="90" x2="650" y1="223.3" y2="223.3" stroke="#d8e0d8" stroke-width="1"/>
<text x="82.0" y="227.3" font-size="12" fill="#5c6762" text-anchor="end" font-weight="400">1.0</text>
<line x1="90" x2="650" y1="146.7" y2="146.7" stroke="#d8e0d8" stroke-width="1"/>
<text x="82.0" y="150.7" font-size="12" fill="#5c6762" text-anchor="end" font-weight="400">1.5</text>
<line x1="90" x2="650" y1="70.0" y2="70.0" stroke="#d8e0d8" stroke-width="1"/>
<text x="82.0" y="74.0" font-size="12" fill="#5c6762" text-anchor="end" font-weight="400">2.0</text>
<line x1="90" x2="650" y1="300" y2="300" stroke="#5c6762" stroke-width="1"/>
<text x="90.0" y="58.0" font-size="13" fill="#5c6762" text-anchor="start" font-weight="400">Hazard Ratio（荷爾蒙組 vs 安慰劑組）</text>
<text x="136.7" y="320.0" font-size="12.5" fill="#5c6762" text-anchor="middle" font-weight="400">第 1 年</text>
<text x="230.0" y="320.0" font-size="12.5" fill="#5c6762" text-anchor="middle" font-weight="400">第 2 年</text>
