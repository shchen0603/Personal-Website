<text x="603.3" y="320.0" font-size="12.5" fill="#5c6762" text-anchor="middle" font-weight="400">第 6 年以後</text>
<line x1="90" x2="650" y1="223.3" y2="223.3" stroke="#5c6762" stroke-width="1.4"/>
<line x1="90" x2="650" y1="186.5" y2="186.5" stroke="#c6922e" stroke-width="2" stroke-dasharray="6 4"/>
