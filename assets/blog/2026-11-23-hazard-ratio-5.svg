<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" role="img" aria-labelledby="t d" font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei','Inter',sans-serif">
<title id="t">WHI 試驗冠心病逐年 Hazard Ratio</title><desc id="d">荷爾蒙療法組相對安慰劑組的冠心病逐年 HR：第 1 年 1.81、第 2 年 1.34、第 3 年 1.27、第 4 年 1.25、第 5 年 1.45、第 6 年以後 0.70；整體 HR 為 1.24。</desc>
<rect width="760" height="380" rx="12" fill="#fbfcf8"/>
<text x="24.0" y="34.0" font-size="17" fill="#17201f" text-anchor="start" font-weight="700">WHI 雌激素＋黃體素試驗：冠心病的逐年 HR</text>
